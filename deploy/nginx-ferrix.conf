# ferrix.overzealous.tech (proxied through Cloudflare)
# Rate limit keyed on the real client IP ($nr_client_ip from conf.d/client-ip-map.conf).
limit_req_zone $nr_client_ip zone=ferrix_render:10m rate=30r/m;
# Live previews are cheap (layout only, SVG): allow editor-speed bursts.
limit_req_zone $nr_client_ip zone=ferrix_preview:10m rate=240r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ferrix.overzealous.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ferrix.overzealous.tech;

    ssl_certificate     /etc/letsencrypt/live/ferrix.overzealous.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferrix.overzealous.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    root /var/www/ferrix;
    index index.html;
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /api/preview {
        limit_req zone=ferrix_preview burst=60 nodelay;
        limit_req_status 429;
        gzip on;
        gzip_types image/svg+xml application/json;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $nr_client_ip;
        proxy_set_header X-Forwarded-For $nr_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=ferrix_render burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $nr_client_ip;
        proxy_set_header X-Forwarded-For $nr_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
